apiVersion: kos.tsic.top/v1beta1
kind: ApplicationDefinition
metadata:
  name: whoami
spec:
  package:
    digest: "sha256:ff2fde9f7d1fef5c5768a79da8c62a3beffb1b6ee077675b530c5718e4139b67"
    version: "1.10.0"
  config:
    - name: replicas
      type: integer
      default: "1"
      minimum: "1"
      maximum: "3"
      description: Number of echo server replicas.
    - name: image
      type: string
      default: "traefik/whoami:v1.10"
      description: Container image to run.
    - name: verbose
      type: boolean
      default: "false"
      description: Echo the full request.
  template: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: {{ .Name }}
      namespace: {{ .Namespace }}
    spec:
      replicas: {{ .Config.replicas }}
      selector:
        matchLabels:
          app: {{ .Name }}
      template:
        metadata:
          labels:
            app: {{ .Name }}
        spec:
          containers:
            - name: {{ .Name }}
              image: {{ .Config.image }}
              args: ["--verbose={{ .Config.verbose }}"]
              ports:
                - containerPort: 80
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: {{ .Name }}
      namespace: {{ .Namespace }}
    spec:
      selector:
        app: {{ .Name }}
      ports:
        - port: 80
          targetPort: 80
