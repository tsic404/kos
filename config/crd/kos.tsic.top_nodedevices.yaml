                type: string
              devices:
                description: Devices lists the hardware facts of the node (C-37).
                items:
                  description: |-
                    DeviceFact is one device the collector observed (C-37). The four layers are
                    independent facts: one being true never implies another.
                  properties:
                    driverReady:
                      description: IsDriverReady reports that the device driver works.
                      type: boolean
