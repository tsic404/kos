                      description: Model is the device model.
                      type: string
                    name:
                      description: Name is the device's name on the node.
                      type: string
                    observedAt:
                      description: ObservedAt orders duplicate records of one serial
                        number.
                      format: date-time
                      type: string
                    occupancy:
                      description: Occupancy names the system holding the device;
                        empty means free (C-37).
                      properties:
                        reference:
                          description: Reference names the holding object inside that
                            system.
                          type: string
                        source:
                          description: Source names the holding system, such as a
                            storage pool.
                          type: string
                      type: object
                    present:
                      description: IsPresent reports that the hardware exists.
                      type: boolean
                    published:
                      description: IsPublished reports that the device is published
                        as a schedulable resource.
                      type: boolean
                    recognized:
                      description: IsRecognized reports that Linux recognised the
                        device.
                      type: boolean
                    serial:
                      description: Serial is the device serial number; duplicate records
                        keep the newest.
                      type: string
                  type: object
                type: array
              node:
                description: Node is the node the facts belong to; it must equal metadata.name
                  (C-37).
                type: string
              observedAt:
                description: ObservedAt is when the collector last observed the facts
                  (C-37).
                format: date-time
                type: string
            type: object
        type: object
