                    enum:
                      description: Enum lists the accepted values of an enum field.
                      items:
                        type: string
                      type: array
                    maximum:
                      description: |-
                        Maximum is the textual inclusive upper bound of an integer or number
                        field, interpreted by Type.
                      type: string
                    minimum:
                      description: |-
                        Minimum is the textual inclusive lower bound of an integer or number
                        field, interpreted by Type.
                      type: string
                    name:
                      description: Name is the field name a submitted config uses.
                      type: string
                    required:
                      description: Required rejects a submission that omits the field.
                      type: boolean
                    sensitive:
                      description: |-
                        Sensitive marks a value the read path masks; it is never returned to a
                        browser (C-31).
                      type: boolean
                    type:
                      description: Type is one of string, integer, number, boolean
                        or enum (C-32).
                      enum:
                      - string
                      - integer
                      - number
                      - boolean
                      - enum
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              hooks:
                description: |-
                  Hooks are optional lifecycle hooks; an exit status expresses the result
                  (C-32).
                items:
                  description: |-
                    Hook is one package hook; a zero exit status succeeds and any other value
                    fails (C-32).
                  properties:
                    command:
                      description: Command is the command the hook runs.
                      items:
                        type: string
                      type: array
                    name:
                      description: Name identifies the hook.
                      type: string
                    timeoutSeconds:
                      description: TimeoutSeconds bounds one run.
                      format: int32
                      type: integer
                  required:
                  - name
                  type: object
                type: array
              package:
                description: |-
                  Package identifies the packaged artifact the definition was installed
                  from (C-32).
                properties:
                  dataFormat:
                    description: |-
                      DataFormat names the stored data format the package reads and writes. An
                      upgrade that changes it is irreversible and is refused (C-34).
                    type: string
                  digest:
                    description: |-
                      Digest is the package digest; the catalogue locks it instead of a tag
                      (C-32).
                    type: string
                  version:
                    description: Version is the package version.
                    type: string
                type: object
              requires:
                description: Requires lists the capability requirements of the definition
                  (C-11).
                items:
                  description: CapabilityRequirement is one capability an application
                    needs (C-11).
                  properties:
                    guarantees:
                      description: Guarantees are the guarantee values the capability
                        must hold (C-11).
                      items:
                        description: |-
                          GuaranteeRequirement declares one guarantee value: a boolean must be equal,
                          an enum must be equal or inside the declared set (C-11).
                        properties:
                          bool:
                            description: Bool is the required boolean value.
                            type: boolean
                          enum:
                            description: Enum is the required enum value.
                            type: string
                          key:
                            description: Key is the guarantee key.
                            type: string
                          oneOf:
                            description: OneOf is the set an enum value may come from.
                            items:
                              type: string
                            type: array
                        required:
                        - key
                        type: object
                      type: array
                    name:
                      description: Name is the capability name.
                      type: string
                    optional:
                      description: |-
                        Optional makes a failed requirement degrade the application instead of
                        keeping it Pending (C-11).
                      type: boolean
                    version:
                      description: Version is the optional version range; empty matches
                        any version.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              resources:
                description: |-
                  Resources is the package's default CPU and memory request and limit set,
                  materialized into an application at installation (C-67).
                properties:
                  limits:
                    description: Limits is the CPU and memory a container may use.
                    properties:
                      cpu:
                        description: CPU is a Kubernetes quantity such as 100m.
                        type: string
                      memory:
                        description: Memory is a Kubernetes quantity such as 128Mi.
                        type: string
                    type: object
                  requests:
                    description: Requests is the CPU and memory a container requests.
                    properties:
                      cpu:
                        description: CPU is a Kubernetes quantity such as 100m.
                        type: string
                      memory:
                        description: Memory is a Kubernetes quantity such as 128Mi.
                        type: string
                    type: object
                type: object
              template:
                description: |-
                  Template is the one-way translation template; it is a pure function of
                  the application and its config (C-32).
                type: string
            type: object
        type: object
    served: true
    storage: false
