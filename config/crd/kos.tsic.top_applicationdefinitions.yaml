                items:
                  description: |-
                    ConfigField is one entry of a config structure. Type decides the value
                    shape: string, integer, number, boolean or enum (C-32).
                  properties:
                    default:
                      description: Default is the textual default, interpreted by
                        Type.
                      type: string
                    description:
                      description: Description is the help text the interface shows.
